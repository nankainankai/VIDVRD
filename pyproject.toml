[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vidvrd-auto"
version = "0.1.0"
description = "Automatic video relation detection pipeline"
requires-python = ">=3.10"
dependencies = [
    "autoawq>=0.2.9",
    "dashscope>=1.25",
    "dds-cloudapi-sdk>=0.5.3",
    "filterpy>=1.4.5",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "Pillow>=10",
    "rex_omni>=1.0.0",
    "scipy>=1.12",
    "transformers>=4.51",
]

[project.scripts]
vidvrd-auto = "vidvrd_auto.cli:main"
vidvrd-build-gold = "vidvrd_auto.evaluation.gold:main"

[tool.setuptools.packages.find]
where = ["src"]
