[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vidvrd-auto"
version = "0.1.0"
description = "OpenClaw-first automatic video relation annotation pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
]

[project.scripts]
vidvrd-auto = "vidvrd_auto.cli:main"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
